name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  # A dispatch is checked as a push is, and released as a push is, if
  # anything a release is built from changed since the last release (mise
  # run release-due); `release` releases regardless. The weekly update
  # dispatches it with `release` when release-due says so, its push having
  # started nothing.
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false

# A run shell is bash -eo pipefail: a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # gofmt, go vet, the tests, shellcheck and the release scripts' tests,
  # through mise, the dev loop's toolchain and the Go a release is built
  # with.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Ubuntu's runners let an unprivileged user namespace be made and then
      # refuse every capability in it (AppArmor). Lifted here, so the
      # namespace tests run rather than skip; and nft, so the test that
      # loads lib.steering's ruleset in a namespace of its own runs too.
      - name: Let unprivileged user namespaces hold capabilities, and install nft
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get install -y -q --no-install-recommends nftables
      - run: mise run check

  # The tests again under the race detector. Its runtime is C, so this job
  # alone builds with cgo (mise run race sets CGO_ENABLED=1 for itself; the
  # runner has gcc); nothing it builds ships, and every release is static.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Let unprivileged user namespaces hold capabilities, and install nft
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get install -y -q --no-install-recommends nftables
      - run: mise run race

  # The static binaries a release carries, for linux on amd64 and arm64
  # (scripts/build.sh, with the Go mise.toml pins), kept as the run's
  # artifact whether or not the commit is released: dist/<os>-<arch>/frisket,
  # which the nix and release jobs and scripts/release-assets.sh look for.
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history, because the version's minor is the commit count;
      # scripts/version.sh refuses a shallow clone rather than stamp a wrong
      # version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run build
      - uses: actions/upload-artifact@v7
        with:
          name: frisket-binaries
          path: dist/
          if-no-files-found: error

  # What needs Nix to check. The flake's package is a release's binary, not
  # a build from source (flake.nix says why): it exists only where
  # nix/release.json does, which on GitHub is a release tag's own commit.
  # So this first evaluates the flake as trunk has it (no package; the
  # checks that need none), then makes this checkout a release of the
  # binaries this run's build job made, scripts/nix-local-release.sh: it
  # writes and stages nix/release.json for them, as the release job will,
  # and adds each binary to the store at the path fetchurl would download it
  # to, which is content-addressed, so only the file whose hash release.json
  # names can stand there and nothing is fetched. The steering check and the
  # VM tests thus run the very binary this run releases, through the same
  # release.json, fetchurl and install a pinned tag uses.
  #
  # Nothing is pushed to Cachix any more: there is no source build to
  # cache, and the binary comes from the release. The danielbodart cache's
  # CACHIX_AUTH_TOKEN secret is still set on the repository, unused.
  nix:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The whole history: scripts/version.sh counts it, to name the
      # binaries' version as the build job did.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # nixos-test and kvm are declared for the VM tests; install-nix-action
      # gives the runner's /dev/kvm to the build user.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # The steering check runs nft in a user+network namespace of its own,
      # inside the Nix build sandbox, and skips that step where the kernel
      # refuses; lifted, as in check, so it runs.
      - name: Let unprivileged user namespaces hold capabilities
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: The flake as trunk has it
        run: nix flake check --print-build-logs

      - uses: actions/download-artifact@v8
        with:
          name: frisket-binaries
          path: artifacts

      - name: This run's binaries as the flake's release
        run: |
          V="$(scripts/version.sh)"
          scripts/release-assets.sh "$V" release artifacts
          scripts/nix-local-release.sh "$V" release

      - name: The flake as a release has it
        run: nix flake check --print-build-logs

  # CONTINUOUS RELEASE. Trunk-based: every push to trunk that passes every
  # job above and changed what a release is built from since the last one
  # (mise run release-due: RELEASE_PATHS and Go's pin) is published, with
  # no manual step and no tag to cut by hand. Gated on a push or a dispatch
  # on trunk (never a pull request), and on every job having succeeded, so
  # a red commit never ships.
  #
  # A release carries its binaries, and the flake's package is them:
  #
  #   tag      v<V>, V = scripts/version.sh (major.commit-count.run-number),
  #            on a commit of its own (below)
  #   binary   frisket-<V>-linux-<arch>, arch in amd64/arm64 (Go's names),
  #            the bare static executable the build job made
  #   sums     SHA256SUMS, sha256sum(1) format, one line per binary
  #
  # scripts/release-assets.sh lays them out and refuses to go on unless the
  # amd64 binary says it is V and the arm64 one contains V.
  #
  # THE TAG'S OWN COMMIT. flake.nix's package is the release's binary,
  # fetched, and a flake fetched as github:danielbodart/frisket/v<V> sees
  # its commit but not its tag, so the version and each asset's URL and
  # hash must be in the tagged tree: nix/release.json
  # (scripts/release-json.sh). It is committed, by github-actions[bot], as
  # a one-commit child of the released trunk commit, and only the tag v<V>
  # is pushed, pointing at that child; trunk never gets the commit. Agents
  # and the weekly update commit to trunk, and a bot commit on origin/trunk
  # would make every local trunk diverge on every release; a tag on no
  # branch does not, and a tag push starts no run here. (Never write the
  # skip-CI marker, the words skip and ci in square brackets, in a commit
  # message, even to say it is not needed: GitHub starts no workflow at all
  # for a push whose head commit's message contains it anywhere.) So the
  # last release is the tag's parent, not an ancestor tag
  # (scripts/last-release.sh, which release-due and the notes ask). The Go
  # module at the tag is the same as at its parent, plus that one file.
  #
  # The derived version makes every build a unique, monotonic release, so
  # two pushes cannot collide on a tag. A re-run of a run keeps its run
  # number: re-running one whose release was already made fails at the
  # tag's push, which never moves a tag.
  release:
    needs: [check, race, build, nix]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To start CI on trunk's head, where this commit cannot be tagged.
      actions: write
    steps:
      # fetch-depth: 0 because the minor is the commit count, which
      # scripts/version.sh REFUSES to count in a shallow clone; fetch-tags so
      # the previous tags, and the commits they name off trunk, are here,
      # for release-due and the notes below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # For release-due, which reads RELEASE_PATHS from mise.toml.
      - uses: jdx/mise-action@v5

      - uses: actions/download-artifact@v8
        with:
          name: frisket-binaries
          path: artifacts

      # Whether to release, and if so the assets, laid out and checked.
      #
      # GitHub refuses GITHUB_TOKEN, which can never hold the workflows
      # permission, a new ref whose .github/workflows differ from trunk's
      # head ("HTTP 403: Resource not accessible by integration"): a tag of
      # this commit (or of its child, whose workflows are its), once trunk
      # has moved on to a commit that changed a workflow, would be one. Then
      # the release is trunk head's to make, its commits including this
      # one's: its own run makes it, or, where it has none (a push made with
      # GITHUB_TOKEN), one started here.
      - name: Decide, and lay out the assets
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.release || false }}
        run: |
          if [ "$FORCE" != true ] && ! mise run release-due; then
            echo "Nothing a release is built from changed since the last release: no release."
            exit 0
          fi
          git fetch -q origin trunk
          head=$(git rev-parse FETCH_HEAD)
          if [ "$head" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" "$head" -- .github/workflows; then
            echo "::warning::trunk is at ${head:0:7}, which changed a workflow since ${GITHUB_SHA:0:7}: GITHUB_TOKEN cannot tag ${GITHUB_SHA:0:7}, so the release is ${head:0:7}'s"
            if [ "$(gh run list --workflow ci.yml --commit "$head" --json databaseId --jq length)" = 0 ]; then
              gh workflow run ci.yml --ref trunk -f release="$FORCE"
            fi
            exit 0
          fi
          V="$(./scripts/version.sh)"
          scripts/release-assets.sh "$V" release artifacts
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Notes from the COMMITS since the last release, written before this
      # release's tag exists. Trunk-based means direct pushes and no pull
      # requests, so GitHub's PR-based --generate-notes would come out empty.
      # On the first release there is no prior tag, so fall back to the head
      # commit rather than dumping the whole history.
      - name: Release notes
        if: steps.due.outputs.version != ''
        env:
          V: ${{ steps.due.outputs.version }}
        run: |
          if read -r _ prev < <(scripts/last-release.sh); then
            git log "$prev..$GITHUB_SHA" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)' "$GITHUB_SHA"; } > notes.md
          fi
          {
            echo
            echo "Static binaries for linux on amd64 and arm64. To check what you downloaded: sha256sum --ignore-missing -c SHA256SUMS"
            echo "With Nix: inputs.frisket.url = \"github:danielbodart/frisket/v$V\"; its package is the binary here."
          } >> notes.md

      # The tag, on its own commit (see the top of this job): nix/release.json
      # for the binaries laid out above, committed on a detached HEAD whose
      # parent is the commit this run tested, and only the tag pushed.
      - name: Tag v<V> on a child commit holding nix/release.json
        if: steps.due.outputs.version != ''
        env:
          V: ${{ steps.due.outputs.version }}
        run: |
          git checkout -q --detach "$GITHUB_SHA"
          mkdir -p nix
          scripts/release-json.sh "$V" release/SHA256SUMS > nix/release.json
          cat nix/release.json
          git add nix/release.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Release v$V" \
              -m "nix/release.json, for flake.nix: the release's version and each binary's URL and hash. This commit is on no branch; only the tag v$V names it."
          git tag "v$V"
          git push -q origin "refs/tags/v$V"

      # The release, on the tag just pushed (--verify-tag: never one GitHub
      # would make itself, on trunk).
      - name: Create GitHub Release
        if: steps.due.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.due.outputs.version }}
        run: gh release create "v$V" --verify-tag --title "v$V" --notes-file notes.md release/*
