# The weekly update: every dependency of every kind moves, in one window
# every danielbodart repo shares, Sunday 21:23 UTC. nix-config takes its own
# at 23:23 on the same nixos-26.05. Its frisket is a release's binary, pinned
# by tag (flake.nix), so nothing here is built for it.
#
# What moves, in order: every flake input (nix flake update); my own repos
# frisket takes, flong and quoin (flake inputs, test-only) and quoin and
# galley (Go modules), to their latest release tags (scripts/pin.sh), a tag
# only existing for a commit its CI passed; each mise.toml tool to the
# latest patch of its pinned minor (a new minor moves by hand, with the
# nixpkgs attribute); and every Go dependency (go get -u).
#
# The gate is everything CI runs: mise's check and race, and nix flake check
# with the binaries it builds made the flake's release, as CI's nix job
# does. Only if it passes is anything committed, straight to trunk, never as
# a pull request.
#
# A push made with GITHUB_TOKEN starts no workflow, so the last step
# dispatches CI on trunk with `release`, which checks the commit and releases
# it -- but only if mise run release-due says something a release is built
# from (RELEASE_PATHS in mise.toml, and Go's pin) changed since the last
# release. A week in which only flake.lock moved releases nothing: a
# consumer follows its own nixpkgs, and the flake's package is the
# release's binary whatever nixpkgs is.
name: Weekly update

on:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shared with anything else that commits to trunk.
concurrency:
  group: update

# A run shell is bash -eo pipefail: a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # The Go mise.toml pins, never one go.mod's toolchain line downloads.
      GOTOOLCHAIN: local
    steps:
      # The whole history and its tags, for mise run release-due.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      - uses: jdx/mise-action@v5

      - name: Move everything
        id: update
        run: |
          moved=()
          gomods() { go mod edit -json | jq -r '.Require[] | "\(.Path) \(.Version)"' | sort; }
          # The tag go.mod requires, or else the one flake.nix's url names.
          ownver() {
            go mod edit -json | jq -r --arg m "github.com/danielbodart/$1" '.Require[] | select(.Path == $m) | .Version' | grep . ||
              sed -n "s|.*url = \"github:danielbodart/$1/\(v[^\"]*\)\";.*|\1|p" flake.nix
          }

          # 1. The flake's inputs, then my own repos to their latest tags.
          nix flake update 2>&1 | tee update.log
          mapfile -t inputs < <(grep -oE "Updated input '[^']+'" update.log | cut -d"'" -f2)
          moved+=("${inputs[@]}")
          before=$(gomods)
          for name in flong quoin galley; do
            was=$(ownver "$name")
            scripts/pin.sh "$name"
            now=$(ownver "$name")
            if [ "$was" != "$now" ]; then moved+=("$name $was -> $now"); fi
          done

          # 2. mise's tools, each to the latest patch of its pinned
          # major.minor (go 1.27.3 asks for 1.27, coreutils 9.12 for 9.12).
          while read -r tool was; do
            now=$(mise latest "$tool@$(cut -d. -f1-2 <<<"$was")")
            if [ -n "$now" ] && [ "$now" != "$was" ]; then
              sed -i -E "s|^(\"?$tool\"? = )\"$was\"|\1\"$now\"|" mise.toml
              moved+=("$tool $was -> $now")
            fi
          done < <(sed -n -E '/^\[tools\]/,/^\[/s/^"?([a-z0-9_:-]+)"? = "([0-9.]+)"$/\1 \2/p' mise.toml)
          mise install

          # 3. Every Go dependency.
          go get -u ./...
          go mod tidy
          mapfile -t mods < <(comm -13 <(echo "$before") <(gomods) | cut -d' ' -f1 | grep -v '^github.com/danielbodart/' || true)
          moved+=("${mods[@]}")

          # 4.
          if git diff --quiet; then
            echo "Nothing moved."
            exit 0
          fi
          list=$(printf '%s\n' "${moved[@]}" | { grep . || true; } | paste -sd, - | sed 's/,/, /g')
          echo "moved=${list:-dependencies}" >> "$GITHUB_OUTPUT"

      # 5. The gate: what CI runs. As CI's, so the namespace tests and the
      # nft one run rather than skip.
      - name: Let unprivileged user namespaces hold capabilities, and install nft
        if: steps.update.outputs.moved
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get install -y -q --no-install-recommends nftables

      - name: mise run check
        if: steps.update.outputs.moved
        run: mise run check

      - name: mise run race
        if: steps.update.outputs.moved
        run: mise run race

      # As CI's nix job: the flake as trunk has it, then the binaries, built
      # as the build job builds them, made the flake's release
      # (scripts/nix-local-release.sh, which stages a nix/release.json that
      # the commit below must not take), and every check again.
      - name: nix flake check, as trunk and as a release
        if: steps.update.outputs.moved
        run: |
          nix flake check --print-build-logs
          mise run build
          V="$(scripts/version.sh)"
          scripts/release-assets.sh "$V" "$RUNNER_TEMP/release" dist
          scripts/nix-local-release.sh "$V" "$RUNNER_TEMP/release"
          nix flake check --print-build-logs
          git rm -q --cached nix/release.json
          rm -rf nix/release.json dist

      # 6.
      - name: Commit and push
        if: steps.update.outputs.moved
        env:
          MOVED: ${{ steps.update.outputs.moved }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Weekly update: $MOVED"
          git pull -q --rebase origin trunk
          git push -q origin HEAD:trunk

      # 7. A release, if a release path moved: CI checks the pushed commit
      # and releases it. A week that moved only flake.lock releases nothing.
      - name: Release, if a release path moved
        if: steps.update.outputs.moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if mise run release-due; then gh workflow run ci.yml --ref trunk -f release=true; fi
